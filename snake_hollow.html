<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hollow Snake Roiz(Profe Edition)</title>
    
    <style>
        body {
            background-color: #1a1a1a; color: #fff; font-family: Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; margin: 0;
        }
        h1 { color: #eee; border-bottom: 2px solid #fff; padding-bottom: 10px; }

        #game-container {
            display: flex; align-items: flex-start; gap: 30px;
            position: relative; 
        }
        canvas {
            background-color: #000; border: 2px solid #fff;
        }
        
        
        #ui-container { width: 200px; }
        #ui-container h2, #ui-container h3 {
            margin: 0 0 10px 0; padding: 0; color: #eee;
        }
        #ui-container h2 { font-size: 22px; }
        #ui-container h3 {
            font-size: 18px; margin-top: 15px; border-bottom: 1px solid #555;
        }
        #score-actual, #nivel-actual { color: #f0c674; }
        #ranking-list {
            list-style: none; padding: 0; margin: 0; font-size: 16px;
        }
        #ranking-list li { padding: 4px 0; }
        
        
        .save-load-buttons { margin-top: 20px; display: grid; gap: 10px; }
        .save-load-buttons button {
            font-size: 16px; padding: 8px; cursor: pointer;
            background-color: #444; color: white; border: 1px solid #777;
        }
        .save-load-buttons button:hover { background-color: #555; }

        
        #menu-overlay {
            position: absolute; top: 0; left: 0;
            width: 604px; height: 604px; 
            background-color: rgba(0, 0, 0, 0.9);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10;
        }
        #menu-overlay h2 { font-size: 24px; }
        #player-name-input {
            font-size: 20px; padding: 10px; text-align: center;
            margin: 20px 0; border: 2px solid #fff; background: #333; color: #fff;
        }
        #start-button {
            font-size: 28px; font-weight: bold; color: #1a1a1a;
            background-color: #eee; padding: 15px 40px;
            border: 2px solid #fff; border-radius: 5px; cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>The Hollow Snake</h1>

    <div id="game-container">
        
        <canvas id="gameCanvas" width="600" height="600"></canvas>

        <div id="menu-overlay">
            <h2>Escribe tu nombre:</h2>
            <input type="text" id="player-name-input" placeholder="Hollow Knight" maxlength="10">
            <button id="start-button">START</button>
        </div>

        <div id="ui-container">
            <h2>Score: <span id="score-actual">0</span></h2>
            <h2 id="nivel-actual">Nivel: 1</h2>
            
            <h3>Top 5 Ranking</h3>
            <ol id="ranking-list"></ol>

            <div class="save-load-buttons">
                <button id="save-button">Guardar Partida</button>
                <button id="load-button">Cargar Partida</button>
            </div>
        </div>

    </div>

    <script src="snake.js"></script>

</body>
</html>
